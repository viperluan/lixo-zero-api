services:
  lixozero-db:
    container_name: lixozero-db
    # Pinado: sem tag a imagem virava `latest`, e a partir do Postgres 18 o
    # data dir mudou de layout (espera o mount em /var/lib/postgresql, nao em
    # /var/lib/postgresql/data). Com a tag aberta, um `docker compose pull`
    # derruba o banco. Nao usar a variante -alpine: trocar glibc por musl muda
    # a collation e invalida indices de texto de um banco ja existente.
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=lixo-zero
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=lixo-zero
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data:rw
    networks:
      - lixozero-network
    # A API roda `prisma migrate deploy` no proprio CMD. Num volume virgem o
    # initdb ainda esta em andamento nesse momento, e sem a condicao abaixo o
    # container da API morre e reinicia ate o banco aceitar conexao.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lixo-zero -d lixo-zero']
      interval: 5s
      timeout: 5s
      retries: 12

  lixozero-redis:
    container_name: lixozero-redis
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - lixozero-redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - lixozero-network

  lixozero-api:
    container_name: lixozero-api
    image: lixozero-api
    build:
      context: .
    restart: always
    depends_on:
      lixozero-db:
        condition: service_healthy
      lixozero-redis:
        condition: service_started
    environment:
      - PORT=${PORT}
      # Montada inline, no mesmo padrao do REDIS_URL abaixo: dentro da rede do
      # compose o host e lixozero-db, enquanto o .env do host aponta para
      # localhost (prisma studio, migrate dev, start:dev). A senha vem do mesmo
      # DB_PASSWORD que alimenta POSTGRES_PASSWORD, entao as duas nao divergem.
      - DATABASE_URL=postgresql://lixo-zero:${DB_PASSWORD}@lixozero-db:5432/lixo-zero?schema=public
      - SECRET_KEY=${SECRET_KEY}
      # Vazio libera qualquer origem — e o que permite o front de dev (5173)
      # falar com a API. Em producao, defina a lista no .env.
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      # Endereço do front usado no link do e-mail de redefinição de senha.
      - URL_FRONT=${URL_FRONT:-}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@lixozero-redis:6379
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - FILA_EMAIL_TENTATIVAS=${FILA_EMAIL_TENTATIVAS:-5}
      - FILA_EMAIL_BACKOFF_MS=${FILA_EMAIL_BACKOFF_MS:-5000}
    networks:
      - proxy-manager
      - lixozero-network
    ports:
      - 3000:3000

  lixozero-worker:
    container_name: lixozero-worker
    image: lixozero-api
    build:
      context: .
    restart: always
    command: node dist/worker.js
    depends_on:
      - lixozero-redis
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD}@lixozero-redis:6379
      - GMAIL_USER=${GMAIL_USER}
      - GMAIL_PASS=${GMAIL_PASS}
      - FILA_EMAIL_CONCORRENCIA=${FILA_EMAIL_CONCORRENCIA:-1}
    networks:
      - lixozero-network
    healthcheck:
      disable: true

networks:
  lixozero-network:
    name: lixozero-network

  proxy-manager:
    name: proxy-manager
    external: true

volumes:
  lixozero-redis-data:
